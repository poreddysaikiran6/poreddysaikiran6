<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%">
  <defs>
    <style>
      @keyframes walk {
        0%  {transform:translateX(-920px)}
        100%{transform:translateX(900px)}
      }
      @keyframes walk2 {
        0%  {transform:translateX(-920px)}
        100%{transform:translateX(900px)}
      }
      @keyframes groundPulse {
        0%,100%{opacity:0.4} 50%{opacity:0.9}
      }
      @keyframes footerTextGlow {
        0%,100%{filter:drop-shadow(0 0 8px #7c3aed)}
        50%    {filter:drop-shadow(0 0 20px #a855f7) drop-shadow(0 0 40px #7c3aed)}
      }
      @keyframes runeFloat {
        0%  {transform:translateY(0) rotate(0deg)  ;opacity:0.3}
        50% {transform:translateY(-8px) rotate(8deg);opacity:0.7}
        100%{transform:translateY(0) rotate(0deg)  ;opacity:0.3}
      }
      @keyframes borderShine {
        0%,100%{stroke-opacity:0.4} 50%{stroke-opacity:0.9}
      }
    </style>
    <radialGradient id="ftBg" cx="50%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#1a0040" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="groundLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#02000a" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#02000a" stop-opacity="1"/>
    </linearGradient>
    <filter id="ftGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ftClip">
      <rect width="900" height="140"/>
    </clipPath>
    <!-- Soldier shape for marching army -->
    <g id="ms">
      <path d="M0,0 L2,-12 Q3,-16 5,-17 Q7,-16 8,-12 L10,0Z" fill="#1a0040"/>
      <ellipse cx="5" cy="-19" rx="3" ry="3.5" fill="#1a0040"/>
      <path d="M1,-10 L-2,-7 M9,-10 L12,-7" stroke="#1a0040" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <g id="mc">
      <path d="M0,0 L2,-14 Q3,-19 6,-20 Q9,-19 10,-14 L12,0Z" fill="#1a0040"/>
      <ellipse cx="6" cy="-23" rx="4" ry="4.5" fill="#1a0040"/>
      <path d="M0,-12 Q-4,-5 -2,0 M12,-12 Q16,-5 14,0" stroke="#1a0040" stroke-width="1" stroke-linecap="round" fill="#1a0040"/>
    </g>
  </defs>

  <!-- BG -->
  <rect width="900" height="140" fill="url(#ftBg)"/>

  <!-- Top border -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#7c3aed" stroke-width="1.5"
    style="animation:borderShine 2.5s ease-in-out infinite"/>

  <!-- Glowing ground line -->
  <rect x="0" y="95" width="900" height="2" fill="url(#groundLine)"
    style="animation:groundPulse 3s ease-in-out infinite"/>
  <!-- Ground shadow below line -->
  <rect x="0" y="97" width="900" height="43" fill="#020008"/>

  <!-- ── MARCHING ARMY ROW 1 (slow) ── -->
  <g clip-path="url(#ftClip)" style="animation:walk 18s linear infinite">
    <use href="#ms" transform="translate(10,95)   scale(2.2)"/>
    <use href="#mc" transform="translate(45,90)   scale(2.5)"/>
    <use href="#ms" transform="translate(88,95)   scale(2)"/>
    <use href="#ms" transform="translate(122,93)  scale(2.3)"/>
    <use href="#mc" transform="translate(162,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(210,95)  scale(2.1)"/>
    <use href="#ms" transform="translate(248,93)  scale(2.2)"/>
    <use href="#mc" transform="translate(286,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(332,95)  scale(2)"/>
    <use href="#ms" transform="translate(368,93)  scale(2.3)"/>
    <use href="#mc" transform="translate(408,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(455,95)  scale(2.1)"/>
    <use href="#ms" transform="translate(492,93)  scale(2.2)"/>
    <use href="#mc" transform="translate(530,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(576,95)  scale(2)"/>
    <use href="#ms" transform="translate(612,93)  scale(2.3)"/>
    <use href="#mc" transform="translate(652,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(698,95)  scale(2.1)"/>
    <use href="#ms" transform="translate(736,93)  scale(2.2)"/>
    <use href="#mc" transform="translate(775,90)  scale(2.5)"/>
    <use href="#ms" transform="translate(818,95)  scale(2)"/>
    <use href="#ms" transform="translate(856,93)  scale(2.3)"/>
  </g>

  <!-- ── MARCHING ARMY ROW 2 (slightly faster, offset) ── -->
  <g clip-path="url(#ftClip)" style="animation:walk2 12s linear 4s infinite">
    <use href="#ms" transform="translate(25,95)   scale(1.6)"/>
    <use href="#ms" transform="translate(58,93)   scale(1.7)"/>
    <use href="#mc" transform="translate(92,90)   scale(1.9)"/>
    <use href="#ms" transform="translate(135,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(170,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(205,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(248,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(284,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(318,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(360,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(395,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(430,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(472,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(507,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(542,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(584,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(620,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(655,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(697,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(734,93)  scale(1.7)"/>
    <use href="#mc" transform="translate(768,90)  scale(1.9)"/>
    <use href="#ms" transform="translate(810,95)  scale(1.6)"/>
    <use href="#ms" transform="translate(848,93)  scale(1.7)"/>
  </g>

  <!-- Floating runes -->
  <text x="60"  y="60" font-size="16" fill="#a855f7" font-family="serif" opacity="0.5"
    style="animation:runeFloat 4s ease-in-out 0s infinite">ᚱ</text>
  <text x="200" y="50" font-size="13" fill="#7c3aed" font-family="serif" opacity="0.4"
    style="animation:runeFloat 5s ease-in-out 1s infinite">ᛉ</text>
  <text x="420" y="45" font-size="11" fill="#c084fc" font-family="serif" opacity="0.35"
    style="animation:runeFloat 3.5s ease-in-out 0.5s infinite">ᚦ</text>
  <text x="660" y="55" font-size="14" fill="#a855f7" font-family="serif" opacity="0.45"
    style="animation:runeFloat 4.5s ease-in-out 1.5s infinite">ᛟ</text>
  <text x="820" y="48" font-size="12" fill="#7c3aed" font-family="serif" opacity="0.4"
    style="animation:runeFloat 5.5s ease-in-out 0.8s infinite">ᚾ</text>

  <!-- Center text -->
  <text x="450" y="78"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="13"
    fill="#c084fc"
    letter-spacing="0.28em"
    filter="url(#ftGlow)"
    style="animation:footerTextGlow 3s ease-in-out infinite">
    ✦  THE SHADOW MONARCH NEVER STOPS LEVELING UP  ✦
  </text>
  <text x="450" y="96"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="9"
    fill="#6d28d9"
    letter-spacing="0.18em"
    opacity="0.7">
    나 혼자만 레벨업 — I ALONE LEVEL UP
  </text>
</svg>
