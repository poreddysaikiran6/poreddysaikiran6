<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

      /* Animations */
      @keyframes borderGlow {
        0%, 100% { stroke: #7c3aed; filter: drop-shadow(0 0 6px #7c3aed); }
        50%      { stroke: #00f0ff; filter: drop-shadow(0 0 16px #00f0ff) drop-shadow(0 0 30px #a855f7); }
      }
      @keyframes scanline {
        0%   { transform: translateY(0); opacity: 0.6; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes ringSpinCW {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes ringSpinCCW {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes textGlowGold {
        0%, 100% { filter: drop-shadow(0 0 4px #eab308); }
        50%      { filter: drop-shadow(0 0 16px #facc15) drop-shadow(0 0 28px #ca8a04); }
      }
      @keyframes textGlowCyan {
        0%, 100% { filter: drop-shadow(0 0 4px #06b6d4); }
        50%      { filter: drop-shadow(0 0 14px #22d3ee) drop-shadow(0 0 24px #0891b2); }
      }
      @keyframes textGlowPurple {
        0%, 100% { filter: drop-shadow(0 0 4px #a855f7); }
        50%      { filter: drop-shadow(0 0 14px #c084fc) drop-shadow(0 0 26px #7c3aed); }
      }
      @keyframes pulseDot {
        0%, 100% { r: 3; opacity: 0.4; }
        50%      { r: 4.5; opacity: 1; }
      }
      @keyframes particleFloatA {
        0%   { transform: translate(0, 0); opacity: 0; }
        20%  { opacity: 0.8; }
        80%  { opacity: 0.6; }
        100% { transform: translate(-8px, -110px); opacity: 0; }
      }
      @keyframes particleFloatB {
        0%   { transform: translate(0, 0); opacity: 0; }
        20%  { opacity: 0.9; }
        80%  { opacity: 0.4; }
        100% { transform: translate(12px, -130px); opacity: 0; }
      }
      @keyframes barGrow {
        0%   { width: 0; }
        100% { width: 100%; }
      }

      .tech-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .scifi-font { font-family: 'Orbitron', 'Trebuchet MS', sans-serif; }
    </style>

    <!-- Gradients -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0e0026"/>
      <stop offset="50%"  stop-color="#060012"/>
      <stop offset="100%" stop-color="#020006"/>
    </radialGradient>

    <linearGradient id="cyberBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00f0ff"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fef08a"/>
      <stop offset="50%"  stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="hardBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="medBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="easyBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="pyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="pyYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Base Background ── -->
  <rect width="880" height="340" rx="16" fill="url(#cyberBg)"/>

  <!-- ── Subtle Sci-Fi Grid Pattern ── -->
  <g opacity="0.07" stroke="#00f0ff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="340"/>
    <line x1="80" y1="0" x2="80" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="280" y1="0" x2="280" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="440" y1="0" x2="440" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="520" y1="0" x2="520" y2="340"/>
    <line x1="560" y1="0" x2="560" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="640" y1="0" x2="640" y2="340"/>
    <line x1="680" y1="0" x2="680" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="760" y1="0" x2="760" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="840" y1="0" x2="840" y2="340"/>

    <line x1="0" y1="40" x2="880" y2="40"/>
    <line x1="0" y1="80" x2="880" y2="80"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="160" x2="880" y2="160"/>
    <line x1="0" y1="200" x2="880" y2="200"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="0" y1="280" x2="880" y2="280"/>
    <line x1="0" y1="320" x2="880" y2="320"/>
  </g>

  <!-- ── Holographic Scan Line ── -->
  <line x1="2" y1="0" x2="878" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"
        style="animation: scanline 4s linear infinite;"/>

  <!-- ── Animated Outer Cyber Border ── -->
  <rect x="2" y="2" width="876" height="336" rx="14" fill="none" stroke-width="2"
        style="animation: borderGlow 5s ease-in-out infinite;"/>

  <!-- Corner Brackets (Sci-Fi HUD Accent) -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 850 12 L 868 12 L 868 30" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 12 310 L 12 328 L 30 328" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 868 310 L 868 328 L 850 328" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

  <!-- ── HEADER BAR ── -->
  <g transform="translate(30, 28)">
    <!-- Status Indicator Dot -->
    <circle cx="6" cy="6" r="4" fill="#00f0ff" style="animation: pulseDot 2s infinite;"/>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>

    <text x="24" y="10" fill="#00f0ff" font-size="12" font-weight="700" letter-spacing="2" class="scifi-font"
          style="animation: textGlowCyan 4s infinite;">
      [ SYSTEM ALERT : S-RANK PYTHON GRANDMASTER &amp; GUARDIAN IDENTIFIED ]
    </text>

    <!-- System ID -->
    <text x="820" y="10" text-anchor="end" fill="#a855f7" font-size="11" font-weight="600" letter-spacing="1" class="tech-font">
      MONARCH_CORE // DSA_PROTOCOL_v3.8
    </text>

    <line x1="0" y1="20" x2="820" y2="20" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- LEFT COLUMN : THE PYTHON MONARCH CYBER SIGIL                       -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(130, 185)">
    <!-- Rotating Cyber Runic Rings -->
    <g style="transform-origin: 0 0; animation: ringSpinCW 20s linear infinite;">
      <circle cx="0" cy="0" r="78" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8 6 18 6 4 10" opacity="0.6"/>
      <circle cx="0" cy="0" r="86" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="12 12" opacity="0.4"/>
    </g>
    <g style="transform-origin: 0 0; animation: ringSpinCCW 14s linear infinite;">
      <circle cx="0" cy="0" r="68" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="24 8 6 8" opacity="0.5"/>
    </g>

    <!-- Floating Mana Particles -->
    <circle cx="-25" cy="40" r="2" fill="#00f0ff" style="animation: particleFloatA 3s ease-out infinite;"/>
    <circle cx="35" cy="50" r="2.5" fill="#c084fc" style="animation: particleFloatB 3.5s ease-out 1s infinite;"/>
    <circle cx="10" cy="60" r="1.8" fill="#38bdf8" style="animation: particleFloatA 2.7s ease-out 0.5s infinite;"/>

    <!-- Central Glowing Core Backlight -->
    <circle cx="0" cy="0" r="48" fill="#1e0048" opacity="0.8" filter="url(#glowPurple)"/>

    <!-- High-Tech Stylized Python Sigil -->
    <g transform="translate(-32, -32) scale(0.64)">
      <!-- Python Blue Snake Head -->
      <path d="M49.99 0C25.4 0 25.96 10.61 25.96 10.61L26 21.61H50.55V25.13H16.14C3.89 25.13 0 32.22 0 49.33C0 66.45 10.74 66.36 10.74 66.36H18.79V54.99C18.79 41.52 30.65 41.6 30.65 41.6H55.13C66.86 41.6 68.31 30.08 68.31 30.08V11.23C68.31 11.23 68.86 0 49.99 0ZM37.33 7.64C39.88 7.64 41.95 9.71 41.95 12.26C41.95 14.81 39.88 16.88 37.33 16.88C34.78 16.88 32.71 14.81 32.71 12.26C32.71 9.71 34.78 7.64 37.33 7.64Z"
            fill="url(#pyBlue)" filter="url(#glowCyan)"/>
      <!-- Python Yellow Snake Head -->
      <path d="M50.01 100C74.6 100 74.04 89.39 74.04 89.39L74 78.39H49.45V74.87H83.86C96.11 74.87 100 67.78 100 50.67C100 33.55 89.26 33.64 89.26 33.64H81.21V45.01C81.21 58.48 69.35 58.4 69.35 58.4H44.87C33.14 58.4 31.69 69.92 31.69 69.92V88.77C31.69 88.77 31.14 100 50.01 100ZM62.67 92.36C60.12 92.36 58.05 90.29 58.05 87.74C58.05 85.19 60.12 83.12 62.67 83.12C65.22 83.12 67.29 85.19 67.29 87.74C67.29 90.29 65.22 92.36 62.67 92.36Z"
            fill="url(#pyYellow)" filter="url(#glowCyan)"/>
    </g>

    <!-- Sub-label below sigil -->
    <text x="0" y="98" text-anchor="middle" fill="#facc15" font-size="12" font-weight="800" letter-spacing="2" class="scifi-font">
      PYTHON 3
    </text>
    <text x="0" y="114" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" class="tech-font">
      PRIMARY WEAPON // 509+ SOLVED
    </text>
  </g>

  <!-- Vertical Divider with Cyber Glow -->
  <line x1="265" y1="65" x2="265" y2="305" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <circle cx="265" cy="185" r="3" fill="#00f0ff" opacity="0.8"/>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT COLUMN : LEETCODE GUARDIAN S-RANK BATTLE MATRIX              -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(290, 70)">

    <!-- Top Badge Row -->
    <g>
      <!-- Guardian Rank Badge Pill -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#1e1138" stroke="#eab308" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="4.5" fill="#facc15" style="animation: pulseDot 2s infinite;"/>
      <text x="26" y="17" fill="#facc15" font-size="11" font-weight="800" letter-spacing="1" class="scifi-font">
        GUARDIAN
      </text>

      <!-- Rating Display -->
      <text x="155" y="20" fill="url(#goldGrad)" font-size="24" font-weight="900" class="scifi-font"
            style="animation: textGlowGold 3s infinite;">
        2,173
      </text>

      <!-- Percentile Pill -->
      <rect x="250" y="0" width="165" height="26" rx="6" fill="#082f49" stroke="#00f0ff" stroke-width="1"/>
      <text x="332" y="17" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" class="tech-font">
        TOP 1.07% WORLDWIDE
      </text>

      <!-- Global Rank -->
      <text x="555" y="18" text-anchor="end" fill="#a78bfa" font-size="12" font-weight="600" class="tech-font">
        GLOBAL RANK: <tspan fill="#ffffff" font-weight="700">#9,137</tspan> / 890K
      </text>
    </g>

    <!-- Subtitle / Lore -->
    <text x="0" y="46" fill="#94a3b8" font-size="11" font-weight="400" class="tech-font">
      Data Structures &amp; Algorithms Conquered via Python • 35 Contests Cleared
    </text>

    <!-- ── PROBLEM SOLVING PROGRESS BARS ── -->
    <g transform="translate(0, 60)">

      <!-- Big Total Circle HUD -->
      <g transform="translate(42, 45)">
        <circle cx="0" cy="0" r="38" fill="#110526" stroke="#7c3aed" stroke-width="3"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="160 80" opacity="0.8"/>
        <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900" class="scifi-font">
          600
        </text>
        <text x="0" y="12" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="700" letter-spacing="1" class="tech-font">
          SOLVED
        </text>
        <text x="0" y="24" text-anchor="middle" fill="#64748b" font-size="8" class="tech-font">
          / 4,096
        </text>
      </g>

      <!-- Breakdown Bars (Hard, Medium, Easy) -->
      <g transform="translate(105, 10)">

        <!-- HARD (S-Rank Dungeons) -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" fill="#f43f5e" font-size="11" font-weight="700" letter-spacing="1" class="scifi-font">
            HARD [ S-RANK ]
          </text>
          <text x="360" y="12" text-anchor="end" fill="#fda4af" font-size="12" font-weight="700" class="tech-font">
            116 <tspan fill="#64748b" font-size="10">/ 986</tspan>
          </text>
          <!-- Track -->
          <rect x="0" y="18" width="360" height="7" rx="3.5" fill="#2d0a16"/>
          <!-- Active Bar (116 / 986 = ~11.7% of total category, normalized visual width ~120px) -->
          <rect x="0" y="18" width="130" height="7" rx="3.5" fill="url(#hardBar)" filter="url(#glowPurple)"/>
        </g>

        <!-- MEDIUM (A-Rank Dungeons) -->
        <g transform="translate(0, 34)">
          <text x="0" y="12" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1" class="scifi-font">
            MEDIUM [ A-RANK ]
          </text>
          <text x="360" y="12" text-anchor="end" fill="#fde68a" font-size="12" font-weight="700" class="tech-font">
            318 <tspan fill="#64748b" font-size="10">/ 2,136</tspan>
          </text>
          <rect x="0" y="18" width="360" height="7" rx="3.5" fill="#291804"/>
          <!-- Active Bar (318 / 2136 = ~15%, normalized visual width ~220px) -->
          <rect x="0" y="18" width="230" height="7" rx="3.5" fill="url(#medBar)"/>
        </g>

        <!-- EASY (B-Rank Dungeons) -->
        <g transform="translate(0, 68)">
          <text x="0" y="12" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="1" class="scifi-font">
            EASY [ B-RANK ]
          </text>
          <text x="360" y="12" text-anchor="end" fill="#a5f3fc" font-size="12" font-weight="700" class="tech-font">
            166 <tspan fill="#64748b" font-size="10">/ 974</tspan>
          </text>
          <rect x="0" y="18" width="360" height="7" rx="3.5" fill="#04202c"/>
          <rect x="0" y="18" width="170" height="7" rx="3.5" fill="url(#easyBar)"/>
        </g>

      </g>
    </g>

    <!-- ── FOOTER STATS TICKER (343 Streak, 24 Badges, 364 Active Days) ── -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="555" height="42" rx="8" fill="#120429" stroke="#7c3aed" stroke-width="1"/>

      <!-- Stat 1: Max Streak -->
      <g transform="translate(18, 14)">
        <text x="0" y="0" fill="#f97316" font-size="11" font-weight="700" class="tech-font">🔥 343 DAYS</text>
        <text x="0" y="14" fill="#64748b" font-size="9" class="tech-font">MAX DAILY STREAK</text>
      </g>

      <line x1="135" y1="8" x2="135" y2="34" stroke="#4c1d95" stroke-width="1"/>

      <!-- Stat 2: Active Days -->
      <g transform="translate(155, 14)">
        <text x="0" y="0" fill="#22c55e" font-size="11" font-weight="700" class="tech-font">⚡ 364 / 365</text>
        <text x="0" y="14" fill="#64748b" font-size="9" class="tech-font">DAYS ACTIVE THIS YEAR</text>
      </g>

      <line x1="285" y1="8" x2="285" y2="34" stroke="#4c1d95" stroke-width="1"/>

      <!-- Stat 3: Badges Earned -->
      <g transform="translate(305, 14)">
        <text x="0" y="0" fill="#eab308" font-size="11" font-weight="700" class="tech-font">🏆 24 BADGES</text>
        <text x="0" y="14" fill="#64748b" font-size="9" class="tech-font">GUARDIAN &amp; CONTESTS</text>
      </g>

      <line x1="420" y1="8" x2="420" y2="34" stroke="#4c1d95" stroke-width="1"/>

      <!-- Stat 4: Contest Attended -->
      <g transform="translate(440, 14)">
        <text x="0" y="0" fill="#a855f7" font-size="11" font-weight="700" class="tech-font">⚔️ 35 CONTESTS</text>
        <text x="0" y="14" fill="#64748b" font-size="9" class="tech-font">WEEKLY / BIWEEKLY</text>
      </g>
    </g>

  </g>

</svg>
