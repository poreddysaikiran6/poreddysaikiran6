<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <style>
      /* ═══════ BACKGROUND ═══════ */
      @keyframes bgPulse {
        0%,100%{stop-color:#06001a} 50%{stop-color:#0d0030}
      }
      /* ═══════ BLOOD MOON ═══════ */
      @keyframes moonPulse {
        0%,100%{opacity:0.18;r:52} 50%{opacity:0.32;r:58}
      }
      @keyframes moonCorePulse {
        0%,100%{opacity:0.55} 50%{opacity:0.85}
      }
      /* ═══════ DUNGEON GATE / PORTAL ═══════ */
      @keyframes gateOpen {
        0%  {opacity:0; transform:scaleY(0.05) scaleX(0.3);}
        30% {opacity:1; transform:scaleY(0.5)  scaleX(0.7);}
        60% {transform:scaleY(1.05) scaleX(1.05);}
        100%{transform:scaleY(1) scaleX(1); opacity:1;}
      }
      @keyframes gateGlow {
        0%,100%{filter:drop-shadow(0 0 12px #7c3aed) drop-shadow(0 0 30px #4c1d95);}
        50%    {filter:drop-shadow(0 0 24px #a855f7) drop-shadow(0 0 60px #7c3aed);}
      }
      @keyframes gateInnerPulse {
        0%,100%{opacity:0.25;transform:scale(0.95);}
        50%    {opacity:0.55;transform:scale(1.05);}
      }
      /* ═══════ MAGIC CIRCLE ═══════ */
      @keyframes spinCW  {from{transform:rotate(0deg)}  to{transform:rotate(360deg)}}
      @keyframes spinCCW {from{transform:rotate(0deg)}  to{transform:rotate(-360deg)}}
      @keyframes circleGlow {
        0%,100%{opacity:0.4} 50%{opacity:0.9}
      }
      /* ═══════ SHADOW ARMY ═══════ */
      @keyframes riseBack {
        0%  {transform:translateY(80px);opacity:0}
        40% {opacity:0.35}
        100%{transform:translateY(0);opacity:0.35}
      }
      @keyframes riseMid {
        0%  {transform:translateY(60px);opacity:0}
        40% {opacity:0.6}
        100%{transform:translateY(0);opacity:0.6}
      }
      @keyframes riseFront {
        0%  {transform:translateY(45px);opacity:0}
        40% {opacity:1}
        100%{transform:translateY(0);opacity:1}
      }
      @keyframes shadowArmy {
        0%,100%{transform:translateY(0px)}
        50%    {transform:translateY(-4px)}
      }
      /* ═══════ JIN-WOO AURA ═══════ */
      @keyframes jinwooAura {
        0%,100%{opacity:0.4;transform:scale(0.97)}
        50%    {opacity:0.75;transform:scale(1.03)}
      }
      @keyframes jinwooEyes {
        0%,85%,100%{opacity:1}
        90%         {opacity:0.1}
      }
      /* ═══════ PARTICLES / EMBERS ═══════ */
      @keyframes emberRise {
        0%  {transform:translateY(0) translateX(0)  scale(1);   opacity:0}
        15% {opacity:1}
        80% {opacity:0.6}
        100%{transform:translateY(-260px) translateX(var(--dx)) scale(0.2); opacity:0}
      }
      @keyframes sparkle {
        0%,100%{opacity:0;transform:scale(0)}
        50%    {opacity:1;transform:scale(1)}
      }
      /* ═══════ MAIN TEXT ═══════ */
      @keyframes ariseReveal {
        0%  {opacity:0;letter-spacing:0.8em;filter:blur(12px)}
        50% {opacity:0.8;filter:blur(2px)}
        100%{opacity:1;letter-spacing:0.18em;filter:blur(0)}
      }
      @keyframes ariseGlow {
        0%,100%{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 28px #7c3aed)}
        50%    {filter:drop-shadow(0 0 22px #c084fc) drop-shadow(0 0 55px #a855f7)}
      }
      @keyframes subReveal {
        0%  {opacity:0;transform:translateY(12px)}
        100%{opacity:0.75;transform:translateY(0)}
      }
      /* ═══════ SCAN LINE ═══════ */
      @keyframes scan {
        0%  {transform:translateY(-10px);opacity:0.7}
        90% {opacity:0.4}
        100%{transform:translateY(320px);opacity:0}
      }
      /* ═══════ RUNE RING ═══════ */
      @keyframes runeOrbit {
        from{transform:rotate(0deg) translateX(115px) rotate(0deg)}
        to  {transform:rotate(360deg) translateX(115px) rotate(-360deg)}
      }
      @keyframes runeOrbitR {
        from{transform:rotate(0deg) translateX(90px) rotate(0deg)}
        to  {transform:rotate(-360deg) translateX(90px) rotate(360deg)}
      }
      /* ═══════ FOG ═══════ */
      @keyframes fogDrift {
        0%  {transform:translateX(-200px);opacity:0.12}
        50% {opacity:0.22}
        100%{transform:translateX(200px);opacity:0.12}
      }
    </style>

    <!-- ── Gradients ── -->
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="70%">
      <stop offset="0%"   stop-color="#130025"/>
      <stop offset="55%"  stop-color="#06001a"/>
      <stop offset="100%" stop-color="#02000a"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#ff4444" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#cc2200" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#800000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jinwooGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02000a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="armyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#02000a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02000a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#02000a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#02000a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#02000a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02000a" stop-opacity="1"/>
    </linearGradient>

    <!-- ── Filters ── -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonFilter">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ── Soldier silhouette shape ── -->
    <g id="sol">
      <path d="M0,0 L2,-14 Q3,-18 5,-19 Q7,-18 8,-14 L10,0 Q7,2 5,2 Q3,2 0,0Z" fill="#000"/>
      <ellipse cx="5" cy="-21" rx="3.5" ry="4" fill="#000"/>
      <path d="M1,-12 L-2,-8 M9,-12 L12,-8" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="cmd">
      <path d="M0,0 L2,-16 Q3,-21 6,-22 Q9,-21 10,-16 L12,0 Q9,2 6,2 Q3,2 0,0Z" fill="#000"/>
      <ellipse cx="6" cy="-25" rx="4.5" ry="5" fill="#000"/>
      <!-- cape -->
      <path d="M0,-14 Q-5,-5 -3,0 L0,0Z M12,-14 Q17,-5 15,0 L12,0Z" fill="#000"/>
      <path d="M1,-14 L-3,-10 M11,-14 L15,-10" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ════════════ BACKGROUND ════════════ -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>

  <!-- ════════════ BLOOD MOON ════════════ -->
  <ellipse cx="450" cy="105" rx="70" ry="70" fill="url(#moonGrad)" filter="url(#moonFilter)"
    style="animation:moonPulse 4s ease-in-out infinite"/>
  <circle cx="450" cy="105" r="42" fill="#cc2200" opacity="0.12"
    style="animation:moonCorePulse 3s ease-in-out infinite"/>
  <circle cx="450" cy="105" r="30" fill="#ff4444" opacity="0.08"
    style="animation:moonCorePulse 2.5s ease-in-out infinite 0.5s"/>

  <!-- ════════════ PORTAL / DUNGEON GATE ════════════ -->
  <!-- Gate glow halo -->
  <ellipse cx="450" cy="175" rx="90" ry="115" fill="url(#portalGrad)"
    style="animation:gateInnerPulse 3s ease-in-out infinite"/>
  <!-- Gate outer ring -->
  <ellipse cx="450" cy="175" rx="75" ry="100"
    fill="none" stroke="#7c3aed" stroke-width="2.5"
    style="animation:gateOpen 2.5s cubic-bezier(.23,1,.32,1) forwards,gateGlow 3s ease-in-out 2.5s infinite"/>
  <!-- Gate inner -->
  <ellipse cx="450" cy="175" rx="62" ry="85"
    fill="#06001a" stroke="#a855f7" stroke-width="1"
    style="animation:gateOpen 2.2s cubic-bezier(.23,1,.32,1) 0.2s forwards"/>
  <!-- Portal dark void -->
  <ellipse cx="450" cy="175" rx="55" ry="75" fill="#020008" opacity="0.95"/>

  <!-- ════════════ MAGIC CIRCLE (AROUND GATE) ════════════ -->
  <g transform="translate(450,175)" style="animation:circleGlow 2.5s ease-in-out infinite">
    <!-- Outer rotating ring -->
    <g style="animation:spinCW 12s linear infinite;transform-origin:0 0">
      <circle cx="0" cy="0" r="108" fill="none" stroke="#7c3aed" stroke-width="1"
        stroke-dasharray="8 6" opacity="0.6"/>
      <!-- Rune marks on ring -->
      <text x="-4" y="-106" font-size="9" fill="#a855f7" font-family="serif" opacity="0.8">ᚱ</text>
      <text x="103"  y="4"   font-size="9" fill="#a855f7" font-family="serif" opacity="0.8">ᛉ</text>
      <text x="-4"  y="112" font-size="9" fill="#a855f7" font-family="serif" opacity="0.8">ᚾ</text>
      <text x="-110" y="4"  font-size="9" fill="#a855f7" font-family="serif" opacity="0.8">ᛟ</text>
    </g>
    <!-- Middle CCW ring -->
    <g style="animation:spinCCW 8s linear infinite;transform-origin:0 0">
      <circle cx="0" cy="0" r="84" fill="none" stroke="#9333ea" stroke-width="0.8"
        stroke-dasharray="4 8" opacity="0.5"/>
      <text x="-4"  y="-82" font-size="8" fill="#c084fc" font-family="serif">ᚦ</text>
      <text x="79"   y="4"  font-size="8" fill="#c084fc" font-family="serif">ᛊ</text>
      <text x="-4"  y="88"  font-size="8" fill="#c084fc" font-family="serif">ᚷ</text>
      <text x="-85"  y="4"  font-size="8" fill="#c084fc" font-family="serif">ᛗ</text>
    </g>
    <!-- Inner CW small ring -->
    <g style="animation:spinCW 5s linear infinite;transform-origin:0 0">
      <circle cx="0" cy="0" r="58" fill="none" stroke="#c084fc" stroke-width="0.6"
        stroke-dasharray="2 5" opacity="0.4"/>
    </g>
    <!-- Triangle inscribed -->
    <polygon points="0,-105 91,52 -91,52" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.35"
      style="animation:spinCCW 20s linear infinite;transform-origin:0 0"/>
    <polygon points="0,105 -91,-52 91,-52" fill="none" stroke="#9333ea" stroke-width="0.8" opacity="0.35"
      style="animation:spinCW 20s linear infinite;transform-origin:0 0"/>
  </g>

  <!-- ════════════ SUNG JIN-WOO SILHOUETTE ════════════ -->
  <!-- Aura behind Jin-Woo -->
  <ellipse cx="450" cy="220" rx="52" ry="80" fill="url(#jinwooGrad)"
    style="animation:jinwooAura 2s ease-in-out infinite"/>
  <!-- Body silhouette — coat/cloak -->
  <g transform="translate(450,120)">
    <!-- Coat sides flowing -->
    <path d="M-10,20 Q-22,55 -18,100 L-6,100 Q-4,65 0,45Z" fill="#0a0020"/>
    <path d="M10,20 Q22,55 18,100 L6,100 Q4,65 0,45Z" fill="#0a0020"/>
    <!-- Body core -->
    <path d="M-8,18 Q-12,50 -10,100 L10,100 Q12,50 8,18Z" fill="#05000f"/>
    <!-- Shoulders -->
    <path d="M-14,22 Q-28,18 -30,30 Q-28,38 -18,36 L-10,26Z" fill="#06001a"/>
    <path d="M14,22 Q28,18 30,30 Q28,38 18,36 L10,26Z" fill="#06001a"/>
    <!-- Neck -->
    <rect x="-4" y="10" width="8" height="12" rx="2" fill="#06001a"/>
    <!-- Head -->
    <ellipse cx="0" cy="5" rx="12" ry="13" fill="#050010"/>
    <!-- Hair streaks -->
    <path d="M-10,-3 Q-14,-8 -10,-14 Q-6,-10 -8,-5Z" fill="#02000a"/>
    <path d="M10,-3 Q14,-8 10,-14 Q6,-10 8,-5Z" fill="#02000a"/>
    <!-- GLOWING EYES -->
    <ellipse cx="-4.5" cy="4" rx="2.8" ry="1.6" fill="#60a5fa" filter="url(#eyeGlow)"
      style="animation:jinwooEyes 4s ease-in-out infinite"/>
    <ellipse cx="4.5"  cy="4" rx="2.8" ry="1.6" fill="#60a5fa" filter="url(#eyeGlow)"
      style="animation:jinwooEyes 4s ease-in-out infinite"/>
    <!-- Eye glow halos -->
    <ellipse cx="-4.5" cy="4" rx="5" ry="3" fill="#3b82f6" opacity="0.3" filter="url(#eyeGlow)"
      style="animation:jinwooEyes 4s ease-in-out infinite"/>
    <ellipse cx="4.5"  cy="4" rx="5" ry="3" fill="#3b82f6" opacity="0.3" filter="url(#eyeGlow)"
      style="animation:jinwooEyes 4s ease-in-out infinite"/>
  </g>

  <!-- ════════════ SHADOW ARMY — 3 PARALLAX LAYERS ════════════ -->
  <!-- Back row -->
  <g style="animation:riseBack 3.5s cubic-bezier(.23,1,.32,1) 0.8s forwards,shadowArmy 6s ease-in-out 4.3s infinite">
    <use href="#sol" transform="translate(35,245)  scale(1.8)"/>
    <use href="#sol" transform="translate(85,250)  scale(1.6)"/>
    <use href="#cmd" transform="translate(130,243) scale(1.9)"/>
    <use href="#sol" transform="translate(190,248) scale(1.7)"/>
    <use href="#sol" transform="translate(240,244) scale(1.8)"/>
    <use href="#sol" transform="translate(615,248) scale(1.7)"/>
    <use href="#sol" transform="translate(665,244) scale(1.8)"/>
    <use href="#cmd" transform="translate(710,243) scale(1.9)"/>
    <use href="#sol" transform="translate(770,250) scale(1.6)"/>
    <use href="#sol" transform="translate(820,245) scale(1.8)"/>
    <!-- Ground bar back -->
    <rect x="0" y="262" width="310" height="58" fill="#02000a"/>
    <rect x="590" y="262" width="310" height="58" fill="#02000a"/>
  </g>

  <!-- Mid row -->
  <g style="animation:riseMid 3s cubic-bezier(.23,1,.32,1) 1.2s forwards,shadowArmy 5s ease-in-out 4.2s infinite 0.5s">
    <use href="#sol" transform="translate(20,255)  scale(2.2)"/>
    <use href="#cmd" transform="translate(72,248)  scale(2.5)"/>
    <use href="#sol" transform="translate(140,257) scale(2.1)"/>
    <use href="#sol" transform="translate(200,252) scale(2.3)"/>
    <use href="#sol" transform="translate(255,255) scale(2)"/>
    <use href="#sol" transform="translate(600,255) scale(2.2)"/>
    <use href="#sol" transform="translate(650,252) scale(2.3)"/>
    <use href="#cmd" transform="translate(700,248) scale(2.5)"/>
    <use href="#sol" transform="translate(775,257) scale(2.1)"/>
    <use href="#sol" transform="translate(840,255) scale(2)"/>
    <!-- Ground bar mid -->
    <rect x="0" y="277" width="310" height="43" fill="#02000a"/>
    <rect x="590" y="277" width="310" height="43" fill="#02000a"/>
  </g>

  <!-- Front row -->
  <g style="animation:riseFront 2.5s cubic-bezier(.23,1,.32,1) 1.6s forwards,shadowArmy 4.5s ease-in-out 4.1s infinite 1s">
    <use href="#sol" transform="translate(5,260)   scale(2.8)"/>
    <use href="#cmd" transform="translate(60,250)  scale(3.2)"/>
    <use href="#sol" transform="translate(138,263) scale(2.6)"/>
    <use href="#sol" transform="translate(200,258) scale(2.9)"/>
    <use href="#cmd" transform="translate(252,250) scale(3)"/>
    <use href="#sol" transform="translate(580,260) scale(2.8)"/>
    <use href="#cmd" transform="translate(628,250) scale(3.2)"/>
    <use href="#sol" transform="translate(706,263) scale(2.6)"/>
    <use href="#sol" transform="translate(768,258) scale(2.9)"/>
    <use href="#cmd" transform="translate(822,250) scale(3)"/>
    <!-- Ground bar front -->
    <rect x="0" y="288" width="310" height="32" fill="#02000a"/>
    <rect x="590" y="288" width="310" height="32" fill="#02000a"/>
  </g>

  <!-- Ground mist / fog -->
  <rect x="0" y="295" width="900" height="25" fill="url(#groundGrad)"/>

  <!-- ════════════ EMBER PARTICLES ════════════ -->
  <circle cx="120" cy="280" r="2.2" fill="#a855f7" style="--dx:15px;animation:emberRise 4s ease-in-out 0s infinite"/>
  <circle cx="200" cy="285" r="1.5" fill="#c084fc" style="--dx:-10px;animation:emberRise 5.5s ease-in-out 0.8s infinite"/>
  <circle cx="280" cy="278" r="2.5" fill="#7c3aed" style="--dx:20px;animation:emberRise 3.8s ease-in-out 1.5s infinite"/>
  <circle cx="370" cy="282" r="1.8" fill="#a855f7" style="--dx:-8px;animation:emberRise 6s ease-in-out 0.3s infinite"/>
  <circle cx="430" cy="275" r="3"   fill="#c084fc" style="--dx:5px;animation:emberRise 4.5s ease-in-out 2s infinite"/>
  <circle cx="470" cy="280" r="1.6" fill="#e879f9" style="--dx:-12px;animation:emberRise 5s ease-in-out 1.1s infinite"/>
  <circle cx="530" cy="283" r="2"   fill="#a855f7" style="--dx:18px;animation:emberRise 4.2s ease-in-out 0.5s infinite"/>
  <circle cx="620" cy="279" r="2.3" fill="#7c3aed" style="--dx:-6px;animation:emberRise 5.8s ease-in-out 1.8s infinite"/>
  <circle cx="710" cy="285" r="1.7" fill="#c084fc" style="--dx:14px;animation:emberRise 3.5s ease-in-out 0.9s infinite"/>
  <circle cx="800" cy="278" r="2.1" fill="#a855f7" style="--dx:-20px;animation:emberRise 4.8s ease-in-out 2.2s infinite"/>
  <!-- Blue arise sparks from Jin-Woo -->
  <circle cx="440" cy="200" r="2"   fill="#60a5fa" style="--dx:-18px;animation:emberRise 3s ease-in-out 0.2s infinite"/>
  <circle cx="460" cy="195" r="1.5" fill="#93c5fd" style="--dx:15px;animation:emberRise 3.5s ease-in-out 0.7s infinite"/>

  <!-- ════════════ SCAN LINE ════════════ -->
  <rect x="0" y="0" width="900" height="2" fill="url(#bgGrad)" opacity="0.4"
    style="animation:scan 6s linear 0s infinite"/>

  <!-- ════════════ SIDE VIGNETTE ════════════ -->
  <rect x="0"   y="0" width="140" height="320" fill="url(#sideGradL)"/>
  <rect x="760" y="0" width="140" height="320" fill="url(#sideGradR)"/>
  <!-- Bottom fade -->
  <rect x="0" y="220" width="900" height="100" fill="url(#armyFade)"/>

  <!-- ════════════ MAIN TEXT ════════════ -->
  <text x="450" y="50"
    text-anchor="middle"
    font-family="Georgia,'Times New Roman',serif"
    font-size="58"
    font-weight="bold"
    fill="#e9d5ff"
    filter="url(#softGlow)"
    style="animation:ariseReveal 2s cubic-bezier(.23,1,.32,1) 0.5s both,ariseGlow 3s ease-in-out 2.5s infinite">
    ARISE.
  </text>
  <!-- Sub text -->
  <text x="450" y="76"
    text-anchor="middle"
    font-family="'Courier New',Courier,monospace"
    font-size="11"
    fill="#a78bfa"
    letter-spacing="0.35em"
    style="animation:subReveal 1s ease 2.2s both">
    — THE SHADOW MONARCH DEVELOPER —
  </text>
</svg>
