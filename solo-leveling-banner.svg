<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @keyframes bgPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.88; }
      }
      @keyframes ariseGlow {
        0%   { opacity: 0; }
        20%  { opacity: 0.3; }
        60%  { opacity: 0.85; }
        100% { opacity: 1; }
      }
      @keyframes ariseFilter {
        0%   { filter: drop-shadow(0 0 0px #a855f7) drop-shadow(0 0 0px #7c3aed); }
        40%  { filter: drop-shadow(0 0 20px #c084fc) drop-shadow(0 0 40px #7c3aed); }
        100% { filter: drop-shadow(0 0 14px #a855f7) drop-shadow(0 0 30px #6d28d9); }
      }
      @keyframes runePulse {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.85; }
      }
      @keyframes ringBreath {
        0%, 100% { opacity: 0.07; }
        50%      { opacity: 0.2; }
      }
      @keyframes floatUp {
        0%   { transform: translateY(0px);   opacity: 0; }
        10%  { opacity: 0.9; }
        85%  { opacity: 0.5; }
        100% { transform: translateY(-170px); opacity: 0; }
      }
      @keyframes scanLine {
        0%   { transform: translateY(0px);   opacity: 0; }
        5%   { opacity: 0.5; }
        95%  { opacity: 0.3; }
        100% { transform: translateY(200px); opacity: 0; }
      }
      @keyframes subAppear {
        0%, 50% { opacity: 0; }
        100%    { opacity: 0.65; }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50%      { stroke-opacity: 0.85; }
      }
      .bg-rect  { animation: bgPulse 4s ease-in-out infinite; }
      .arise    { animation: ariseGlow 3.5s ease-out forwards, ariseFilter 3.5s ease-out forwards; }
      .rune-a   { animation: runePulse 2.8s ease-in-out infinite; }
      .rune-b   { animation: runePulse 2.8s ease-in-out 0.7s infinite; }
      .rune-c   { animation: runePulse 2.8s ease-in-out 1.4s infinite; }
      .ring1    { animation: ringBreath 3s ease-in-out infinite; }
      .ring2    { animation: ringBreath 3s ease-in-out 1s infinite; }
      .scan     { animation: scanLine 6s linear 0.5s infinite; }
      .subtitle { animation: subAppear 5s ease-out 2s forwards; opacity: 0; }
      .border   { animation: borderGlow 3s ease-in-out infinite; }
    </style>

    <radialGradient id="bg_grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  stop-color="#1a0035" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0010" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="center_aura" cx="50%" cy="50%" r="45%">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strong_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text_glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="800" height="200" rx="10" fill="url(#bg_grad)"/>
  <rect width="800" height="200" rx="10" fill="url(#center_aura)"/>

  <!-- Border -->
  <rect class="border" x="1.5" y="1.5" width="797" height="197" rx="9.5" fill="none"
        stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="4" y="4" width="792" height="192" rx="8" fill="none"
        stroke="#6d28d9" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Divider lines -->
  <rect x="0" y="100" width="800" height="0.5" fill="url(#line_grad)" opacity="0.12"/>

  <!-- Scan line -->
  <rect class="scan" x="0" y="0" width="800" height="1.5" fill="url(#line_grad)" opacity="0.55"/>

  <!-- Ambient rings -->
  <circle class="ring1" cx="400" cy="100" r="80" fill="none"
          stroke="#a855f7" stroke-width="1.2" filter="url(#soft_glow)"/>
  <circle class="ring2" cx="400" cy="100" r="55" fill="none"
          stroke="#7c3aed" stroke-width="0.8" filter="url(#soft_glow)"/>
  <!-- Center soft glow blob -->
  <ellipse cx="400" cy="100" rx="100" ry="55" fill="#7c3aed" opacity="0.07" filter="url(#strong_glow)"/>

  <!-- === LEFT RUNE CLUSTER === -->
  <text class="rune-a" x="55"  y="118" font-size="30" fill="#a855f7" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚢ</text>
  <text class="rune-b" x="92"  y="78"  font-size="20" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚱ</text>
  <text class="rune-c" x="125" y="148" font-size="15" fill="#6d28d9" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛟ</text>
  <text class="rune-b" x="28"  y="62"  font-size="17" fill="#8b5cf6" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚨ</text>
  <text class="rune-c" x="155" y="52"  font-size="13" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛉ</text>
  <text class="rune-a" x="72"  y="168" font-size="14" fill="#9333ea" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛏ</text>
  <text class="rune-c" x="38"  y="148" font-size="11" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚷ</text>

  <!-- === RIGHT RUNE CLUSTER === -->
  <text class="rune-a" x="745" y="118" font-size="30" fill="#a855f7" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚦ</text>
  <text class="rune-b" x="708" y="78"  font-size="20" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛊ</text>
  <text class="rune-c" x="675" y="148" font-size="15" fill="#6d28d9" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚾ</text>
  <text class="rune-b" x="772" y="62"  font-size="17" fill="#8b5cf6" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛗ</text>
  <text class="rune-c" x="645" y="52"  font-size="13" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᛜ</text>
  <text class="rune-a" x="728" y="168" font-size="14" fill="#9333ea" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚠ</text>
  <text class="rune-c" x="762" y="148" font-size="11" fill="#7c3aed" text-anchor="middle" filter="url(#soft_glow)" font-family="serif">ᚺ</text>

  <!-- === PARTICLES — left === -->
  <circle cx="55"  cy="188" r="2"   fill="#c084fc" style="animation: floatUp 4s ease-in 0s infinite"/>
  <circle cx="85"  cy="190" r="1.5" fill="#a855f7" style="animation: floatUp 4s ease-in 0.6s infinite"/>
  <circle cx="120" cy="188" r="2.5" fill="#ddd6fe" style="animation: floatUp 4s ease-in 1.2s infinite"/>
  <circle cx="150" cy="190" r="1.5" fill="#c084fc" style="animation: floatUp 4s ease-in 1.8s infinite"/>
  <circle cx="30"  cy="188" r="2"   fill="#a855f7" style="animation: floatUp 4s ease-in 2.4s infinite"/>
  <circle cx="108" cy="190" r="1"   fill="#e9d5ff" style="animation: floatUp 4s ease-in 3s infinite"/>

  <!-- === PARTICLES — center === -->
  <circle cx="345" cy="188" r="2"   fill="#c084fc" style="animation: floatUp 4s ease-in 0.2s infinite"/>
  <circle cx="370" cy="190" r="1.5" fill="#a855f7" style="animation: floatUp 4s ease-in 0.8s infinite"/>
  <circle cx="400" cy="188" r="2.5" fill="#ddd6fe" style="animation: floatUp 4s ease-in 1.4s infinite"/>
  <circle cx="425" cy="190" r="1.5" fill="#c084fc" style="animation: floatUp 4s ease-in 2s infinite"/>
  <circle cx="455" cy="188" r="2"   fill="#a855f7" style="animation: floatUp 4s ease-in 2.6s infinite"/>

  <!-- === PARTICLES — right === -->
  <circle cx="640" cy="188" r="2"   fill="#c084fc" style="animation: floatUp 4s ease-in 0.4s infinite"/>
  <circle cx="665" cy="190" r="1.5" fill="#a855f7" style="animation: floatUp 4s ease-in 1s infinite"/>
  <circle cx="700" cy="188" r="2.5" fill="#ddd6fe" style="animation: floatUp 4s ease-in 1.6s infinite"/>
  <circle cx="730" cy="190" r="1.5" fill="#c084fc" style="animation: floatUp 4s ease-in 2.2s infinite"/>
  <circle cx="758" cy="188" r="2"   fill="#a855f7" style="animation: floatUp 4s ease-in 2.8s infinite"/>
  <circle cx="780" cy="190" r="1"   fill="#e9d5ff" style="animation: floatUp 4s ease-in 3.4s infinite"/>

  <!-- === MAIN TEXT "ARISE." === -->
  <text class="arise"
        x="400" y="118"
        font-size="66"
        font-weight="700"
        fill="#ede9fe"
        text-anchor="middle"
        letter-spacing="14"
        font-family="Georgia, 'Times New Roman', serif"
        filter="url(#text_glow)">ARISE.</text>

  <!-- === SUBTITLE === -->
  <text class="subtitle"
        x="400" y="158"
        font-size="12.5"
        fill="#a855f7"
        text-anchor="middle"
        letter-spacing="5"
        font-family="Georgia, 'Times New Roman', serif">— SHADOW MONARCH'S CALL —</text>

  <!-- Corner diamonds -->
  <polygon points="12,12 20,20 12,28 4,20"  fill="#7c3aed" opacity="0.7"/>
  <polygon points="788,12 796,20 788,28 780,20" fill="#7c3aed" opacity="0.7"/>
  <polygon points="12,188 20,180 12,172 4,180"  fill="#7c3aed" opacity="0.7"/>
  <polygon points="788,188 796,180 788,172 780,180" fill="#7c3aed" opacity="0.7"/>
</svg>
